<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>صِلة - SILA | غرف فيديو خاصة</title><link rel="manifest" href="/manifest.json"><script src="https://cdn.tailwindcss.com"></script><script src="/socket.io/socket.io.js"></script><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet"><style>body{font-family:'Tajawal',sans-serif;background:#0a0a0f;color:white}</style></head><body class="min-h-screen flex flex-col"><header class="p-4 flex justify-between items-center border-b border-white/10">  <h1 class="text-2xl font-extrabold">صِلة <span class="text-[#6c5ce7]">SILA</span></h1>  <span class="text-xs bg-white/10 px-3 py-1 rounded-full">P2P مشفر • بدون تسجيل</span></header>
<!-- الصفحة الرئيسية --><div id="home" class="flex-1 flex items-center justify-center p-6">  <div class="max-w-md w-full bg-white/[0.06] backdrop-blur border border-white/10 rounded-[24px] p-7">    <h2 class="text-3xl font-bold text-center">أنشئ مجلسك الخاص</h2>    <p class="text-center text-white/60 mt-2 text-sm">رابط واحد + كلمة سر = فيديو HD وصوت نقي وشات</p>    
    <label class="block mt-6 text-sm">كلمة سر الغرفة</label>    <input id="pass" type="password" placeholder="مثلاً: 1234" class="w-full mt-2 p-3.5 rounded-xl bg-white/10 border border-white/10 outline-none focus:border-[#6c5ce7]">    
    <button onclick="createRoom()" class="w-full mt-4 p-3.5 rounded-xl bg-[#6c5ce7] font-bold text-lg hover:bg-[#5a4bd1]">إنشاء غرفة الآن </button>    
    <div id="linkBox" class="hidden mt-4 p-4 bg-black/30 rounded-xl">      <p class="text-xs text-white/60">انسخ الرابط وارسله لاصدقائك:</p>      <div class="flex gap-2 mt-2">        <input id="link" readonly class="flex-1 p-2 rounded-lg bg-white/10 text-sm text-left" dir="ltr">        <button onclick="copyLink()" class="px-4 bg-white text-black rounded-lg font-bold">نسخ</button>      </div>      <img id="qr" class="mx-auto mt-3 rounded-lg bg-white p-2 w-32 h-32 hidden">      <a id="joinBtn" class="block text-center mt-3 p-3 bg-green-500 rounded-xl font-bold">دخول الغرفة الآن →</a>    </div>    <p class="text-center text-xs text-white/40 mt-4">تتحمل حتى 8 أشخاص • يعمل على كل المتصفحات</p>  </div></div>
<!-- غرفة الفيديو --><div id="room" class="hidden flex-1 flex flex-col">  <div class="p-3 flex justify-between items-center bg-black/20">    <div><b id="roomIdText"></b> <span id="count" class="text-xs bg-[#6c5ce7] px-2 py-1 rounded-full mr-2">1</span></div>    <button onclick="copyLink()" class="text-xs bg-white text-black px-3 py-1.5 rounded-full font-bold">نسخ الرابط</button>  </div>  <div id="videos" class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-2 p-2 bg-black"></div>  
  <div class="bg-[#1a1a22] p-2 flex justify-center gap-2">    <button onclick="toggleMic()" id="micBtn" class="w-12 h-12 rounded-full bg-white/10">🎤</button>    <button onclick="toggleCam()" id="camBtn" class="w-12 h-12 rounded-full bg-white/10">📷</button>    <button onclick="shareScreen()" class="w-12 h-12 rounded-full bg-white/10">🖥️</button>    <button onclick="location.href='/'" class="px-6 bg-red-500 rounded-full font-bold">خروج</button>  </div>  <div class="h-44 border-t border-white/10 flex">    <div id="chats" class="flex-1 overflow-y-auto p-3 text-sm space-y-1"></div>    <div class="flex p-2 gap-2 w-full absolute bottom-[64px] bg-[#1a1a22]">      <input id="msg" placeholder="اكتب رسالة..." class="flex-1 p-2.5 rounded-full bg-white/10 outline-none px-4" onkeydown="if(event.key==='Enter')sendMsg()">      <button onclick="sendMsg()" class="px-6 bg-[#6c5ce7] rounded-full font-bold">إرسال</button>    </div>  </div></div>
<!-- دخول بكلمة سر --><div id="gate" class="hidden fixed inset-0 bg-black/80 backdrop-blur flex items-center justify-center p-6">  <div class="bg-[#1e1e26] p-6 rounded-2xl w-full max-w-sm text-center border border-white/10">    <h3 class="font-bold text-lg">الغرفة محمية 🔒</h3>    <p class="text-sm text-white/60 mt-1">أدخل كلمة السر للدخول</p>    <input id="gatePass" type="password" class="w-full mt-4 p-3 rounded-xl bg-white/10 border border-white/10 outline-none text-center">    <button onclick="joinRoom()" class="w-full mt-3 p-3 bg-[#6c5ce7] rounded-xl font-bold">دخول</button>    <p id="wrong" class="hidden text-red-400 text-sm mt-2">كلمة السر خاطئة</p>  </div></div>
<script>const socket = io();const iceServers = [{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"},{urls:"turn:openrelay.metered.ca:80",username:"openrelayproject",credential:"openrelayproject"}];let localStream, roomId, roomPass, peers={}, isMic=true, isCam=true;
if(location.pathname.startsWith('/room/')){  roomId = location.pathname.split('/')[2];  document.getElementById('home').classList.add('hidden');  document.getElementById('gate').classList.remove('hidden');}function createRoom(){  roomPass = document.getElementById('pass').value || "1234";  if(!roomPass) return alert('ضع كلمة سر');  roomId = Math.random().toString(36).substring(2,7);  showLink();  history.pushState({},'',"/room/"+roomId);}function showLink(){  const link = location.origin + "/room/" + roomId;  document.getElementById('linkBox').classList.remove('hidden');  document.getElementById('link').value = link;  document.getElementById('qr').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(link)}`;  document.getElementById('qr').classList.remove('hidden');  document.getElementById('joinBtn').href = link;}function copyLink(){ navigator.clipboard.writeText(document.getElementById('link')?.value || location.href); alert('تم النسخ ✅'); }
async function joinRoom(){  roomPass = document.getElementById('gatePass').value;  if(!roomPass) return;  document.getElementById('gate').classList.add('hidden');  document.getElementById('room').classList.remove('hidden');  document.getElementById('roomIdText').innerText = "غرفة: "+roomId;  localStream = await navigator.mediaDevices.getUserMedia({video:true,audio:true});  addVideo(localStream, 'أنت', true);  socket.emit('join-room', {roomId, password: roomPass});}socket.on('wrong-password', ()=>{ document.getElementById('gate').classList.remove('hidden'); document.getElementById('wrong').classList.remove('hidden'); });socket.on('all-users', users => users.forEach(id=> createPeer(id, true)));socket.on('user-joined', id => createPeer(id, false));socket.on('signal', async ({from, signal})=>{  const pc = peers[from];  if(signal.sdp) await pc.setRemoteDescription(new RTCSessionDescription(signal.sdp));  if(signal.candidate) await pc.addIceCandidate(new RTCIceCandidate(signal.candidate));  if(signal.sdp && signal.sdp.type==='offer'){ const ans=await pc.createAnswer(); await pc.setLocalDescription(ans); socket.emit('signal',{to:from, signal:{sdp:pc.localDescription}}); }});socket.on('user-left', id=>{ peers[id]?.close(); delete peers[id]; document.getElementById('vid-'+id)?.remove(); updateCount(); });socket.on('chat', d=> addChat(d.name, d.text));
async function createPeer(id, initiator){  const pc = new RTCPeerConnection({iceServers});  peers[id]=pc;  localStream.getTracks().forEach(t=> pc.addTrack(t, localStream));  pc.onicecandidate = e=> e.candidate && socket.emit('signal',{to:id, signal:{candidate:e.candidate}});  pc.ontrack = e=> addVideo(e.streams[0], 'ضيف', false, id);  if(initiator){ const offer=await pc.createOffer(); await pc.setLocalDescription(offer); socket.emit('signal',{to:id, signal:{sdp:pc.localDescription}}); }}function addVideo(stream, name, muted, id){  if(document.getElementById('vid-'+(id||'me'))) return;  const v=document.createElement('video'); v.autoplay=true; v.playsInline=true; v.muted=!!muted; v.srcObject=stream;  v.className="w-full h-full object-cover bg-zinc-900 rounded-xl"; v.id='vid-'+(id||'me');  const wrap=document.createElement('div'); wrap.className="relative aspect-video bg-zinc-900 rounded-xl overflow-hidden"; wrap.appendChild(v);  const label=document.createElement('div'); label.className="absolute bottom-2 right-2 bg-black/60 text-xs px-2 py-1 rounded-full"; label.innerText=name; wrap.appendChild(label);  document.getElementById('videos').appendChild(wrap); updateCount();}function updateCount(){ document.getElementById('count').innerText = document.getElementById('videos').children.length; }function toggleMic(){ isMic=!isMic; localStream.getAudioTracks().forEach(t=>t.enabled=isMic); document.getElementById('micBtn').style.opacity=isMic?1:0.4 }function toggleCam(){ isCam=!isCam; localStream.getVideoTracks().forEach(t=>t.enabled=isCam); document.getElementById('camBtn').style.opacity=isCam?1:0.4 }async function shareScreen(){ const s=await navigator.mediaDevices.getDisplayMedia({video:true}); const track=s.getVideoTracks()[0]; Object.values(peers).forEach(pc=>pc.getSenders().find(s=>s.track.kind==='video').replaceTrack(track)); addVideo(s,'شاشتي',true,'screen'); track.onended=()=>Object.values(peers).forEach(pc=>pc.getSenders().find(s=>s.track.kind==='video').replaceTrack(localStream.getVideoTracks()[0])); }function sendMsg(){ const t=document.getElementById('msg').value; if(!t) return; socket.emit('chat',{roomId,text:t,name:'أنت'}); document.getElementById('msg').value=''; }function addChat(name,text){ const d=document.createElement('div'); d.innerHTML=`<b class="text-[#6c5ce7]">${name}:</b> ${text}`; document.getElementById('chats').appendChild(d); }if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script></body></html>
